[project]
name = "portfoliomanagement"
version = "0.1.0"
description = "Monte Carlo simulation of a rebalanced, regime-switching portfolio."
authors = [
    {name = "Evan Voelker",email = "evancvoelker@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "yfinance (>=1.7.0,<2.0.0)"
]


[tool.poetry]
packages = [{include = "gbm"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
